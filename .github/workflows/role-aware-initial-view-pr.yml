name: Apply and test role-aware initial view

on:
  pull_request:
    branches:
      - codex/role-aware-initial-view-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: codex/role-aware-initial-view-v1
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply source patch
        run: |
          python3 scripts/apply_role_aware_initial_view_patch.py
          python3 scripts/update_role_aware_existing_tests.py
          python3 scripts/update_role_aware_navigation_test.py

      - name: Install frontend dependencies
        working-directory: firebase-hosting-dev
        run: npm install --no-audit --no-fund

      - name: Run frontend regression tests
        working-directory: firebase-hosting-dev
        run: npm test

      - name: Run static build check
        working-directory: firebase-hosting-dev
        run: npm run build

      - name: Run duplicate-function guard
        run: node tests/performance-no-duplicate-functions.test.mjs

      - name: Commit tested patch to target branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            firebase-hosting-dev/app.js \
            firebase-hosting-dev/auth-registration-projects.test.mjs \
            firebase-hosting-dev/initial-view-routing.test.mjs \
            firebase-hosting-dev/navigation-budget-dashboard.test.mjs \
            firebase-hosting-dev/package.json
          git diff --cached --check
          git commit -m "perf: route initial view by role and user intent"
          git push origin HEAD:codex/role-aware-initial-view-v1
