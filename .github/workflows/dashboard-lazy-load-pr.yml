name: Apply and test Dashboard lazy-load patch

on:
  pull_request:
    branches:
      - codex/dashboard-lazy-load-user-intent
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: codex/dashboard-lazy-load-user-intent
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply source patch
        run: |
          python3 scripts/apply_dashboard_lazy_load_patch.py
          python3 scripts/update_dashboard_lazy_load_regression_tests.py

      - name: Install frontend dependencies
        working-directory: firebase-hosting-dev
        run: npm install --no-audit --no-fund

      - name: Run frontend regression tests
        working-directory: firebase-hosting-dev
        run: npm test

      - name: Run static build check
        working-directory: firebase-hosting-dev
        run: npm run build

      - name: Run duplicate-function guard
        run: node tests/performance-no-duplicate-functions.test.mjs

      - name: Commit tested patch to target branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            firebase-hosting-dev/app.js \
            firebase-hosting-dev/dashboard-critical-path.test.mjs \
            firebase-hosting-dev/dashboard-lazy-load.test.mjs \
            firebase-hosting-dev/gantt-request-concurrency.test.mjs \
            firebase-hosting-dev/performance-critical-boot.test.mjs \
            firebase-hosting-dev/package.json \
            apps-script-dev-api/28_DEV_API.js
          git diff --cached --check
          git commit -m "perf: make Dashboard explicit lazy-load"
          git push origin HEAD:codex/dashboard-lazy-load-user-intent
