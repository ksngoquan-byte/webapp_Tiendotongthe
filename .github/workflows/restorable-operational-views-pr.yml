name: Apply and test restorable operational views

on:
  pull_request:
    branches:
      - codex/restorable-operational-views-v2
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: codex/restorable-operational-views-v2
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply source patch
        run: python3 scripts/apply_restorable_operational_views_patch.py

      - name: Install frontend dependencies
        working-directory: firebase-hosting-dev
        run: npm install --no-audit --no-fund

      - name: Run frontend regression tests
        working-directory: firebase-hosting-dev
        run: npm test

      - name: Run static build check
        working-directory: firebase-hosting-dev
        run: npm run build

      - name: Run duplicate-function guard
        run: node tests/performance-no-duplicate-functions.test.mjs

      - name: Commit tested patch to target branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            firebase-hosting-dev/app.js \
            firebase-hosting-dev/initial-view-routing.test.mjs
          git diff --cached --check
          git commit -m "fix: restore only operational initial views"
          git push origin HEAD:codex/restorable-operational-views-v2
